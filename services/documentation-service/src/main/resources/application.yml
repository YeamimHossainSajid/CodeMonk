server:
  port: 8086

spring:
  application:
    name: documentation-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
