spring:
  main:
    web-application-type: reactive

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  cloud:
    discovery:
      enabled: false
    gateway:
      discovery:
        locator:
          enabled: false

eureka:
  client:
    enabled: false